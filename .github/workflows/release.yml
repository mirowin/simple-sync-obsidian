name: Release

on:
  push:
    tags:
      - "*.*.*"
    branches:
      - "release/*.*.*"

jobs:
  release_from_tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate and create draft plugin release
        uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server archives
        run: npm run package
      - name: Attach optional installation archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          release/simple-encrypted-sync-plugin-*.zip
          release/simple-encrypted-sync-server-*.zip
          --clobber

  publish_release_branch:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Run Obsidian community checks
        uses: obsidianmd/obsidian-workflows@v1
        with:
          scanner-lint: true
      - run: npm ci
      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF#refs/heads/release/}"
          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$manifest_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release assets
        run: |
          npm run package
          mkdir -p release-assets
          cp dist/main.js release-assets/main.js
          cp manifest.json release-assets/manifest.json
          cp styles.css release-assets/styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$VERSION"
          release-assets/main.js
          release-assets/manifest.json
          release-assets/styles.css
          release/simple-encrypted-sync-plugin-*.zip
          release/simple-encrypted-sync-server-*.zip
          --target "$GITHUB_SHA"
          --title "Simple Encrypted Sync $VERSION"
          --generate-notes
