services:
  sync:
    build: ./server
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: 8787
    volumes:
      - sync_data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - sync
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  sync_data:
  caddy_data:
  caddy_config:
